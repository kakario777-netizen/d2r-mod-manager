name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build StormLib / CascLib (x64, UNICODE)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ladislav-zezula/StormLib
          git clone --depth 1 https://github.com/ladislav-zezula/CascLib
          cmake -S StormLib -B sb -A x64 -DBUILD_SHARED_LIBS=ON -DSTORM_UNICODE=ON -DSTORM_USE_BUNDLED_LIBRARIES=ON -DWITH_BUNDLED_LIBTOMMATH=ON -DWITH_BUNDLED_LIBTOMCRYPT=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build sb --config Release
          cmake -S CascLib -B cb -A x64 -DCASC_BUILD_SHARED_LIB=ON -DCASC_UNICODE=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build cb --config Release
          New-Item -ItemType Directory -Force app/lib | Out-Null
          $s = Get-ChildItem sb -Recurse -Filter *.dll | Where-Object { $_.Name -match 'storm' } | Select-Object -First 1
          $c = Get-ChildItem cb -Recurse -Filter *.dll | Where-Object { $_.Name -match 'casc' } | Select-Object -First 1
          Copy-Item $s.FullName app/lib/StormLib.dll
          Copy-Item $c.FullName app/lib/CascLib.dll
          Get-ChildItem app/lib

      - name: Self test
        run: python app/selftest.py

      - name: Build exe
        shell: pwsh
        run: |
          $v = "1.0.${{ github.run_number }}"
          "__version__ = `"$v`"" | Out-File -Encoding utf8 app/version.py
          pip install pyinstaller
          pyinstaller --noconfirm --onefile --windowed --uac-admin --name D2RModManager `
            --paths app `
            --add-binary "app/lib/StormLib.dll;." --add-binary "app/lib/CascLib.dll;." `
            app/main.py
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$env:VERSION" dist/D2RModManager.exe `
            --title "D2R 모드 정리기 v$env:VERSION" `
            --notes "D2RModManager.exe 를 받아서 실행하세요. (관리자 권한으로 켜져요)"
